# CT-M02 — Login com senha incorreta
#
# Caminho negativo: o app precisa recusar e explicar o motivo, sem deixar
# o usuário passar. Testar só o caminho feliz esconde exatamente o tipo de
# falha que chega ao usuário final.
appId: com.saucelabs.mydemoapp.rn
name: CT-M02 - Login com senha incorreta
tags:
  - login
---
- runFlow: comum/abrir-app.yaml

- tapOn:
    text: "open menu"
- tapOn: "Log In"
- assertVisible:
    text: "login screen"

- tapOn:
    text: "Username input field"
- inputText: "bob@example.com"

- tapOn:
    text: "Password input field"
- inputText: "senha_errada"

- hideKeyboard
- tapOn:
    text: "Login button"

# Permanece na tela de login e exibe a mensagem de erro.
- assertVisible:
    text: ".*Provided credentials do not match any user in this service.*"
