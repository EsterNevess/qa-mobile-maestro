# CT-M01 — Login com credenciais válidas
#
# Credenciais de demonstração publicadas pela própria Sauce Labs na tela
# de login do app. Não há dado real envolvido.
#
# Sobre os seletores: este app usa `accessibilityLabel` no Android, que vira
# content-desc — e não `resource-id`. Por isso os elementos são buscados por
# `text`, que no Maestro casa com o texto visível OU com o rótulo de
# acessibilidade. Usar `id` aqui não encontra nada.
appId: com.saucelabs.mydemoapp.rn
name: CT-M01 - Login com credenciais validas
tags:
  - login
  - smoke
---
- runFlow: comum/abrir-app.yaml

- tapOn:
    text: "open menu"
- tapOn: "Log In"
- assertVisible:
    text: "login screen"

- tapOn:
    text: "Username input field"
- inputText: "bob@example.com"

- tapOn:
    text: "Password input field"
- inputText: "10203040"

- hideKeyboard
- tapOn:
    text: "Login button"

# Depois de autenticar, o app volta para a lista de produtos.
- assertVisible: "Products"
